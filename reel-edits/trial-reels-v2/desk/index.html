<title>Trial Reels Desk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Layout: a calm production desk. Sticky header with view switch, then Board / List / Phone views; a side sheet for each reel; a posting checklist that gates "Mark as posted". */
:root{
  --bg:#F3E9DE; --surface:#FBF6F0; --sunk:#E9D7C4; --line:#D3B89E;
  --ink:#2E1D0D; --muted:#6B5440; --accent:#0F5F61; --accent-ink:#F3E9DE; --plum:#5A283E;
  --s-film:#9A7B5F; --s-clip:#C76A4A; --s-edited:#0F5F61; --s-posted:#5A283E;
  --frame-a:#0F5F61; --frame-b:#492F16;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B130C; --surface:#251A11; --sunk:#30231A; --line:#4A3726;
  --ink:#F1E4D5; --muted:#BFA88F; --accent:#5FB3B0; --accent-ink:#10201F; --plum:#C58AA3;
  --s-film:#B59A80; --s-clip:#E08A6B; --s-edited:#5FB3B0; --s-posted:#C58AA3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B130C; --surface:#251A11; --sunk:#30231A; --line:#4A3726;
  --ink:#F1E4D5; --muted:#BFA88F; --accent:#5FB3B0; --accent-ink:#10201F; --plum:#C58AA3;
  --s-film:#B59A80; --s-clip:#E08A6B; --s-edited:#5FB3B0; --s-posted:#C58AA3; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:14px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em}
h1 em{font-style:italic;color:var(--accent)}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:500 12px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
select,input[type=search],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{min-width:0;flex:1 1 200px;max-width:320px}
button.btn{font:600 12px var(--body);letter-spacing:.04em;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted)}
main{padding-block:4px 48px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted))}
.st-film{--dot:var(--s-film)}.st-clip{--dot:var(--s-clip)}.st-edited{--dot:var(--s-edited)}.st-posted{--dot:var(--s-posted)}
/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h2{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;margin:2px 4px 4px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .ln{font-family:var(--display);font-size:16px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.meta .kw{color:var(--plum);font-weight:600;letter-spacing:.06em}
.empty{font-size:12px;color:var(--muted);padding:6px 4px}
/* List */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--sunk)}
td.ln{font-family:var(--display);font-size:15px;max-width:340px}
td.num{text-align:right}
/* Phone */
.phones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.phone{display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--frame-a),var(--frame-b));box-shadow:0 1px 0 var(--line)}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(73,47,22,.7),rgba(73,47,22,0) 38%)}
.frame .tx{position:absolute;left:7.4%;right:9.3%;top:11.5%;font-family:var(--display);color:#E9D7C4;font-size:clamp(11px,8.5cqw,40px);line-height:1.16;text-shadow:0 0 14px rgba(73,47,22,.9),0 0 4px rgba(73,47,22,.8)}
.frame{container-type:inline-size}
.frame .badge{position:absolute;left:8px;bottom:8px;background:rgba(27,19,12,.7);color:#F3E9DE;font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(27,19,12,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.sheet .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sheet section{display:flex;flex-direction:column;gap:8px}
.lbl{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cap{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:260px;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.stats input{width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.warn{font-size:12px;color:var(--s-clip)}
/* Post dialog */
.post{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:16px}
.post .box{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.post h4{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.step .no{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.step.done .no{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.checks label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:40}
.offline{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header><div class="wrap">
  <h1>Trial reels <em>desk</em></h1>

</div></header>

    <select id="f-section" aria-label="Section"><option value="">All sections</option></select>
    <select id="f-status" aria-label="Status"><option value="">All statuses</option></select>

    <span class="note" id="sync">Connecting…</span>

<script id="reels-data" type="application/json">[{"n":"01","line":"I built systems for 80+ brands. Mine came last.","section":"Story","broll":"scrolling slowly through a folder of client brand files on the laptop.","audio":{"track":"November Rain","artist":"Guns N' Roses"},"backup":"Everlong, Foo Fighters","caption":"Eight years, more than 80 brands, and the business that ran entirely on one person was my own.\n\nTry the sort I wish I'd done years earlier. List every task, decision and message from last week that only you handled. Mark each one: only I can do this, someone could do it with a rule, someone could do it with a template.\n\nWhen I finally did it, most of my list sat in the last two columns.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It runs the same sort across your whole business.\n\nNew here? I'm Tara. Follow for the structure behind a business that grows without depending on you.","keyword":"AUDIT","slug":"01-i-built-systems-for-80-brands","placeholders":[]},{"n":"02","line":"At 21 I had an agency. At [26], no evenings.","section":"Story","broll":"an empty office at night, one desk lamp on, a laptop still open.","audio":{"track":"Linger","artist":"The Cranberries"},"backup":"November Rain","caption":"I grew my first agency the only way I knew. Say yes, work later, be the person every client could reach. Revenue went up and my evenings went with it.\n\nThe question I'd ask anyone in that place: if revenue doubled tomorrow, would your hours double too? If yes, your calendar is the ceiling.\n\nThree things break the link. One offer that doesn't get reinvented for each client. A delivery process someone else can follow. Decision rules, so the team stops waiting for you.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, the free guide to all three and four more.\n\nNew here? I'm building business three differently. Follow along.","keyword":"SYSTEM","slug":"02-at-21-i-had-an-agency","placeholders":["[26]"]},{"n":"03","line":"The athlete in me nearly broke the founder in me.","section":"Story","broll":"feet on a court, one slow-motion training rep.","audio":{"track":"Everlong","artist":"Foo Fighters"},"backup":"What You Waiting For?, Gwen Stefani","caption":"Sport taught me discipline and how to push through. Both made me a good founder, for a while.\n\nWhat I forgot is that athletes never train without recovery. Rest days are scheduled. The programme decides, not the mood on the day.\n\nYour business can run the same way. Block deep work, batch admin, and keep one day where nothing reaches you. Plan the week once and let the plan carry you.\n\nComment SYSTEM for The 7 Boring Systems. System 7 is the Designed Week.\n\nNew here? I'm Tara, founder of Aluna. Follow for a business built like a training programme.","keyword":"SYSTEM","slug":"03-the-athlete-in-me-nearly-broke","placeholders":[]},{"n":"04","line":"What I'd tell myself at $40K a month.","section":"Story","broll":"a hand writing in a notebook, the page titled “dear me”.","audio":{"track":"Sweet Heat Lightning","artist":"Gregory Alan Isakov"},"backup":"Linger","caption":"Three things, for the version of me running a $40K month on [twelve]-hour days.\n\nBeing the person everyone waits for feels important. It's also the ceiling on everything you build.\n\nWrite it down before you hire. A one-page role card and a recorded walkthrough would have saved me months.\n\nKnow three numbers every week: cash in the bank, cash due in the next 30 days, and your own hours spent on delivery.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about your version of these.\n\nNew here? I'm Tara. Follow for what I'd do differently, and what I'm doing now.","keyword":"REDESIGN","slug":"04-what-id-tell-myself-at-40k","placeholders":["[twelve]"]},{"n":"05","line":"The most expensive person on my payroll got paid last.","section":"Story","broll":"a spreadsheet of payments, the cursor stopping on the last row.","audio":{"track":"Sunshine (Instrumental)","artist":"Twista"},"backup":"Self Aware, Temper City","caption":"When I ran my agency, I paid everyone before me. Contractors, tools, rent, tax. Me, if anything was left.\n\nThe rule I'd set past $30K a month: fix your founder pay as a monthly amount and move it on the same day every month, before anything discretionary. It's payroll, so treat it that way.\n\nIf the business can't cover it comfortably, that's information. The price is too low, delivery is too heavy, or costs have crept.\n\nComment AUDIT for the free Founder Dependency Audit. It shows where the business leans on you, money included.\n\nNew here? Follow for the money side of a business that doesn't run on you.","keyword":"AUDIT","slug":"05-the-most-expensive-person-on-my","placeholders":[]},{"n":"06","line":"Corporate taught me the one thing founders skip.","section":"Story","broll":"a whiteboard, a simple table of names and decisions being drawn.","audio":{"track":"Self Aware","artist":"Temper City"},"backup":"Sunshine (Instrumental)","caption":"After my agency, I led communications and marketing at a sustainable materials company. The biggest lesson was about who decides what.\n\nIn a well-run company every recurring decision has an owner. In most founder-led businesses, everything goes to the founder because she's the only safe answer.\n\nBuild the map in an afternoon. List every decision that reached you in the last two weeks, and next to each, who should own it and the rule they'd follow. Discounts under a set amount. Scope changes under a set number of hours.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 2 is the Decision Rules.\n\nNew here? I'm Tara. Follow for big-company structure without the big company.","keyword":"SYSTEM","slug":"06-corporate-taught-me-the-one-thing","placeholders":[]},{"n":"07","line":"Business three. Rule one: nothing comes to me by default.","section":"Story","broll":"a notebook page headed “rules”, a pen underlining the first line.","audio":{"track":"What You Waiting For?","artist":"Gwen Stefani"},"backup":"Housewife, Tate McRae","caption":"I'm building my third business, and I wrote the rules before the offer.\n\nRule one means every question, decision and request has a home that isn't my inbox.\n\nYou can start even if your business is already running. Open last week's messages. For each one that came to you, write where it should have gone instead: a shared inbox, a client lead, a written rule, a template. Then set up those homes one at a time.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about building your rules.\n\nNew here? Follow while business three gets built this way.","keyword":"REDESIGN","slug":"07-business-three-rule-one-nothing-comes","placeholders":[]},{"n":"08","line":"I said yes to every client for [three] years.","section":"Story","broll":"an inbox filling with enquiries, a finger tapping reply.","audio":{"track":"Dracula","artist":"Tame Impala"},"backup":"Housewife","caption":"Every enquiry, every custom request, every “could you also”. Yes.\n\nIt felt like growth. It was why the business couldn't grow without me, because when every client gets something slightly different, only you know what each one was promised.\n\nThe fix is an Offer Spec. One page: the outcome, the steps you take every time, what's included and what isn't, and the five extras you're asked for with your answer to each.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 1 is the Offer Spec.\n\nNew here? I'm Tara, founder of Aluna. Follow for the systems that let a service business grow.","keyword":"SYSTEM","slug":"08-i-said-yes-to-every-client","placeholders":["[three]"]},{"n":"09","line":"The night I realised the business was me.","section":"Story","broll":"a laptop glowing in a dark room, a phone face down beside it.","audio":{"track":"Strangers","artist":"Kenya Grace"},"backup":"Linger","caption":"Late, unwell, still answering messages because nobody else could. I didn't own a business. I owned a job I couldn't take a day off from.\n\nAsk yourself one question. If you were unreachable for seven days from tomorrow, what would stop? Client questions only you can answer. Payments only you approve. Logins only you hold.\n\nEvery line on that list needs an owner, a rule or a document. None of them needs more of your hours.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It turns that question into a score.\n\nNew here? I'm Tara. Follow for a business that can survive a sick day.","keyword":"AUDIT","slug":"09-the-night-i-realised-the-business","placeholders":[]},{"n":"10","line":"Building my third business. Here's what's different.","section":"Story","broll":"a laptop open at an outdoor table by the ocean, a coffee, a notebook.","audio":{"track":"So Easy (To Fall In Love)","artist":"Olivia Dean"},"backup":"Angel Of My Dreams, JADE","caption":"The first two taught me what not to repeat. This one is being built on purpose.\n\nProfit before headcount: every hire has to take a decision off my desk. Offer, delivery and decision rules written before the clients arrive. Numbers every Friday: cash in, cash due, hours on delivery. A designed week, where deep work, client time and admin each get their own days.\n\nIt's what lets a business grow without taking your life with it.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about yours.\n\nNew here? I'm Tara, founder of Aluna. Follow along while business three gets built.","keyword":"REDESIGN","slug":"10-building-my-third-business-heres-whats","placeholders":[]},{"n":"11","line":"$50K a month. Nothing left after payroll.","section":"Money","broll":"a banking app balance on a phone, a thumb scrolling down the outgoings.","audio":{"track":"Autumn Colors","artist":"LuLuMusic"},"backup":"Sunshine (Instrumental)","caption":"Founders tell me this quietly. The revenue looks great. The balance on the 28th says otherwise.\n\nUsually it's three small leaks. Pricing set when the business was smaller. Delivery that takes more hours than the price assumed. Costs that crept up one tool at a time.\n\nA 20-minute check: last month's revenue minus every cost, including what you should have paid yourself. That's your real margin. Then divide revenue by total delivery hours. If the margin is under 20%, the fix is rarely more sales.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 5 makes this check routine.\n\nNew here? I'm Tara. I help founders build businesses that grow without depending on them.","keyword":"SYSTEM","slug":"11-50k-a-month-nothing-left-after","placeholders":[]},{"n":"12","line":"Raising your prices won't fix this.","section":"Money","broll":"a proposal on screen, the price field being edited.","audio":{"track":"Housewife","artist":"Tate McRae"},"backup":"Nicole Kidman, ADÉLA","caption":"If you're past $40K a month and still exhausted, a price rise can make it heavier. When you're the one delivering, a higher price raises the expectation that you'll personally be there.\n\nThe price that holds is attached to an outcome the business delivers. That needs three things first: a clear Offer Spec, a delivery process someone else can follow, and a client lead who isn't you from week one.\n\nAsk yourself: if a client paid double tomorrow, who would they expect to see?\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about your pricing and delivery.\n\nNew here? I spent eight years on strategy for 80+ brands. Follow for pricing that doesn't depend on your hours.","keyword":"REDESIGN","slug":"12-raising-your-prices-wont-fix-this","placeholders":[]},{"n":"13","line":"Your real hourly rate. Work it out in 60 seconds.","section":"Money","broll":"a phone calculator, fingers tapping in two numbers.","audio":{"track":"Sunshine (Instrumental)","artist":"Twista"},"backup":"Self Aware","caption":"Take what you paid yourself last month. Divide it by every hour you worked, evenings and weekend messages included.\n\n$8,000 across 240 hours is about $33 an hour. For a founder running a $40K-a-month business, that number usually stings.\n\nA low founder rate means one of three things: you're underpaying yourself, you're doing work someone else could do, or the business needs your hours to function. Usually it's the third, and that's a design question.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It shows which hours the business quietly relies on.\n\nNew here? I'm Tara, founder of Aluna. Follow for the numbers founders don't usually run.","keyword":"AUDIT","slug":"13-your-real-hourly-rate-work-it","placeholders":[]},{"n":"14","line":"Payroll's Friday. Two invoices are 30 days late.","section":"Money","broll":"a wall calendar with Friday circled in red.","audio":{"track":"Luminary","artist":"Joel Sunny"},"backup":"Strangers","caption":"Cash flow trouble in a service business usually comes from timing, and from the founder being the only one who chases.\n\nThree fixes cover most of it. Invoice on delivery day, every time, from a template. Put payment terms and a late fee in the contract, and enforce them. Hand chasing to someone else with a script, because a reminder from operations gets paid faster than an awkward one from you.\n\nThen every Friday, list what's due in and out over the next four weeks. Ten minutes.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, Monthly Numbers included.\n\nNew here? I'm Tara, founder of Aluna. Follow for cash flow that doesn't keep you up.","keyword":"SYSTEM","slug":"14-payrolls-friday-two-invoices-are-30","placeholders":[]},{"n":"15","line":"“Can I actually afford my first hire?”","section":"Money","broll":"a job ad half written on a laptop, the cursor blinking.","audio":{"track":"What You Waiting For?","artist":"Gwen Stefani"},"backup":"Hold On, We're Going Home","caption":"Right question, asked in the wrong order. First ask what the hire will own: outcomes and decisions, beyond tasks. Someone who owns client onboarding end to end frees your week. Someone who “helps with admin” usually adds a manager to your job, and the manager is you.\n\nThen cost it properly: salary, tools, onboarding, and your own hours training them for two months. That last line is the one founders miss.\n\nDocument the role before they start. A one-page role card, a recorded walkthrough, and what they can decide alone.\n\nComment SYSTEM for The 7 Boring Systems. System 6 is the Role Cards.\n\nNew here? I'm Tara. Follow for hiring that takes things off your plate.","keyword":"SYSTEM","slug":"15-can-i-actually-afford-my-first","placeholders":[]},{"n":"16","line":"3 numbers to check every Friday. None of them is revenue.","section":"Money","broll":"a notebook page with three numbers in a column, a pen circling the first.","audio":{"track":"Self Aware","artist":"Temper City"},"backup":"Autumn Colors","caption":"One: cash due in over the next 30 days, against what's due out. A gap shows up four weeks early, well before payday.\n\nTwo: delivery hours last week, yours and the team's. If this rises while revenue holds still, the offer is getting heavier.\n\nThree: qualified conversations booked for the next two weeks. Revenue three months from now is decided here.\n\nTen minutes, same time each week. Anyone on your team can pull them. You just read them.\n\nComment SYSTEM and I'll send you The 7 Boring Systems with the Monthly Numbers template.\n\nNew here? I'm Tara, founder of Aluna. Follow for the routines that keep a business calm.","keyword":"SYSTEM","slug":"16-3-numbers-to-check-every-friday","placeholders":[]},{"n":"17","line":"I undercharged for years. Here's the real reason.","section":"Money","broll":"a proposal, a highlighter running over the fee line.","audio":{"track":"Beautiful Things","artist":"Benson Boone"},"backup":"Linger","caption":"When only you can deliver the work, every sale is a promise about your own time. Charging more feels like promising more of yourself, so you hold back. The price ends up capped by your capacity.\n\nOnce delivery is designed so the business delivers it, you're selling a defined outcome with a process and a team behind it.\n\nTry this: write what the client gets at the end, in their words. List every step to get there and mark the ones only you can do. If most are marked, start there before you touch the price. It's a design problem, and design is fixable.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about your offer.\n\nNew here? I'm Tara. Follow for pricing built on outcomes.","keyword":"REDESIGN","slug":"17-i-undercharged-for-years-heres-the","placeholders":[]},{"n":"18","line":"$40K a month and still chasing every invoice?","section":"Money","broll":"typing a polite follow-up email, the cursor hovering over send.","audio":{"track":"Upside Down","artist":"Diana Ross"},"backup":"Dracula","caption":"It's one of the clearest signs a business still routes through its founder. A job with no reason to be yours.\n\nThe handover: write three reminders for day 1, day 7 and day 14 overdue. Friendly, firm, firmer. Load them into your invoicing tool and decide who sends them. One rule: anything past 30 days comes to you with a recommendation attached.\n\nConsistency gets you paid faster than awkwardness.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It finds what else is on your plate only because nobody wrote it down.\n\nNew here? I'm Tara, founder of Aluna. Follow for the small handovers that change your week.","keyword":"AUDIT","slug":"18-40k-a-month-and-still-chasing","placeholders":[]},{"n":"19","line":"Revenue up 20%. Profit down. Here's why.","section":"Money","broll":"a spreadsheet chart, one line rising, another dipping.","audio":{"track":"Raindance","artist":"Dave and Tems"},"backup":"Self Aware","caption":"New clients come in, each slightly different. Delivery takes longer than the price assumed. A contractor, then a tool, then evenings again. Each new dollar costs more than the last.\n\nLook at profit per client. Take your last ten: fee, delivery hours, direct costs. You'll usually find two or three making most of the profit and a few quietly losing money.\n\nThen design around the profitable ones. What did they buy? How was it delivered? Make that the standard offer.\n\nComment SYSTEM for The 7 Boring Systems. The Offer Spec and Monthly Numbers are where this starts.\n\nNew here? I'm Tara. I've spent eight years inside the growth plans of 80+ brands. Follow for profit you can keep.","keyword":"SYSTEM","slug":"19-revenue-up-20-profit-down-heres","placeholders":[]},{"n":"20","line":"Pay yourself on the 1st. Before anything else.","section":"Money","broll":"a bank transfer screen, a fixed amount entered, confirm pressed.","audio":{"track":"Blue Moon","artist":"Zara Larsson"},"backup":"Sunshine (Instrumental)","caption":"If founder pay is whatever's left, you're the shock absorber for the business. Good months you overpay without a plan. Bad months you skip it and feel it at home.\n\nSet a fixed monthly amount and move it on the same date as payroll. Put tax aside in a separate account at the same time. Build a two-month cash reserve before any new hire or big spend.\n\nThe pressure is useful. It shows quickly whether your prices, delivery and costs actually work.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit, which looks at finance alongside six other areas.\n\nNew here? I'm Tara, founder of Aluna. Follow for a business that pays its founder properly.","keyword":"AUDIT","slug":"20-pay-yourself-on-the-1st-before","placeholders":[]},{"n":"21","line":"7 boring systems. Most $50K businesses miss 3.","section":"Systems","broll":"a notebook page with seven numbered lines, three of them blank.","audio":{"track":"Sunshine (Instrumental)","artist":"Twista"},"backup":"Self Aware","caption":"Offer Spec. Decision Rules. Delivery Playbook. Pipeline Rhythm. Monthly Numbers. Role Cards. Designed Week.\n\nAcross 80+ brands, the three I've seen missing most often are the Decision Rules, the Delivery Playbook and the Role Cards. They're also the three that keep the founder at the centre of everything.\n\nScore yourself: 0 if it lives in your head, 1 if it's half written, 2 if the team uses it without asking. Under 10 out of 14 shows you where your time is going.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, with templates for all seven.\n\nNew here? I'm Tara. Follow for one boring system at a time.","keyword":"SYSTEM","slug":"21-7-boring-systems-most-50k-businesses","placeholders":[]},{"n":"22","line":"Record it once. Never explain it again.","section":"Systems","broll":"a screen recording starting, a cursor moving through a task.","audio":{"track":"Autumn Colors","artist":"LuLuMusic"},"backup":"Sunshine (Instrumental)","caption":"If you've explained something twice, record it the third time.\n\nKeep a running list of anything you explain more than once. On Friday, pick the top three. Record each while you do the task, talking through the why as well as the how. Five to ten minutes each, one shared folder, named by task.\n\nNext time someone asks, send the link. After a month you'll have twelve walkthroughs and a team that checks the folder before checking with you.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 3 is the Delivery Playbook.\n\nNew here? I'm Tara. I help founders build businesses that grow without depending on them.","keyword":"SYSTEM","slug":"22-record-it-once-never-explain-it","placeholders":[]},{"n":"23","line":"“It's quicker if I just do it.”","section":"Systems","broll":"hands typing fast on a laptop.","audio":{"track":"Housewife","artist":"Tate McRae"},"backup":"Nicole Kidman","caption":"It is quicker. Today.\n\nDo the maths on one task. Twenty minutes, three times a week, is an hour a week. Roughly 50 hours a year.\n\nA proper handover usually takes two hours: a recording, a short checklist and one rule for when to come to you. Two hours once, against fifty a year.\n\nPick one task this week you keep doing because it's quicker, and hand it over properly.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It finds the tasks quietly costing you most.\n\nNew here? I'm Tara, founder of Aluna. Follow for handovers that stick.","keyword":"AUDIT","slug":"23-its-quicker-if-i-just-do","placeholders":[]},{"n":"24","line":"Your best client asks. Only you know the answer.","section":"Systems","broll":"a phone notification lighting up on a desk.","audio":{"track":"Linger","artist":"The Cranberries"},"backup":"Strangers","caption":"4pm on a Friday. Your team could answer it. They just don't have the context, the history or the permission.\n\nCreate one client file per account: the brief, what was promised, key decisions, preferences and the last three conversations. Whoever speaks to the client updates it after every call, including you.\n\nThen set the rule. The team answers from the file first, and only brings you what the file can't answer, with their suggested reply.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, client file template included.\n\nNew here? I'm Tara. Follow for a business that knows what you know.","keyword":"SYSTEM","slug":"24-your-best-client-asks-only-you","placeholders":[]},{"n":"25","line":"One page that lets someone else deliver your work.","section":"Systems","broll":"a single printed page placed on a desk, a hand smoothing it flat.","audio":{"track":"My Own Universe","artist":"PattiJ North"},"backup":"Autumn Colors","caption":"Every service business has a method. In most, it lives in the founder's head.\n\nThe Delivery Playbook takes it out. One page per offer: the outcome in the client's words, the four to six stages every project moves through, what good looks like at each stage, where work is reviewed and by whom, and the three things that most often go off plan.\n\nWrite it with the person who'll use it. Run the next project from the page and fix what's missing.\n\nComment SYSTEM and I'll send you The 7 Boring Systems with the Delivery Playbook template.\n\nNew here? After eight years building strategy for other people's brands, this is the page I'd hand every founder.","keyword":"SYSTEM","slug":"25-one-page-that-lets-someone-else","placeholders":[]},{"n":"26","line":"AI won't fix a business with no process.","section":"Systems","broll":"an AI chat window open, the cursor over an empty prompt box.","audio":{"track":"Dracula","artist":"Tame Impala"},"backup":"Luminary","caption":"AI is brilliant at following a process and poor at guessing one. If proposals, onboarding or reporting live only in your head, a tool gives you a faster version of the confusion.\n\nThe order that works: write the process with the steps, the standard and one example of good. Test it with a person following the page. Then hand the repeatable parts to AI: drafting, summarising, formatting, first passes.\n\nStart with a recap after client calls. Write the template, then let AI fill it from your notes.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. It's the process layer AI needs.\n\nNew here? I'm Tara, founder of Aluna. Follow for AI that frees up your week.","keyword":"SYSTEM","slug":"26-ai-wont-fix-a-business-with","placeholders":[]},{"n":"27","line":"15 quick questions a day. That's 6 hours a week.","section":"Systems","broll":"a phone buzzing on a desk, a hand turning it face down.","audio":{"track":"Luminary","artist":"Joel Sunny"},"backup":"Strangers","caption":"Each question takes a couple of minutes, plus a few more to get back into what you were doing. Call it five. Fifteen a day is 75 minutes, gone in fragments.\n\nTry office hours. Two fixed windows a day, say 1pm and 4pm, when the team brings you anything. Outside them, questions go into one shared place, written down. Agree three situations that can interrupt you anytime.\n\nWithin a fortnight, half the questions get answered by the person asking, because writing them down makes them think.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about where your hours are going.\n\nNew here? I'm Tara, founder of Aluna. Follow for the structure behind a calmer week.","keyword":"REDESIGN","slug":"27-15-quick-questions-a-day-thats","placeholders":[]},{"n":"28","line":"Could someone run your Monday without you?","section":"Systems","broll":"a calendar on screen, Monday packed with blocks.","audio":{"track":"Hold On, We're Going Home","artist":"Drake"},"backup":"Housewife","caption":"Monday is when the week gets set. If it can't start without you, nothing in it can.\n\nMake Monday independent. Each person posts priorities, owners and blockers in writing before 10am. One person runs the check-in. A standing agenda decides what gets discussed.\n\nYou still read it, and you still weigh in where it matters. The week starts either way.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It runs this test across the whole business.\n\nNew here? I'm Tara. I help founders build businesses that start the week without them.","keyword":"AUDIT","slug":"28-could-someone-run-your-monday-without","placeholders":[]},{"n":"29","line":"Your team has asked this question before. Probably twice.","section":"Systems","broll":"a search bar in the team chat, the same question appearing three times.","audio":{"track":"The Blue Danube Waltz","artist":""},"backup":"Upside Down","caption":"Answers that live in old messages can't be found, so people ask you.\n\nStart a shared document called How we decide. Every time you answer something that could come up again, add one line: the situation, the answer and the reason. Group by clients, money, delivery and tools.\n\nThen one team habit: check the document before asking. If it isn't there, ask, and whoever gets the answer adds it. Within six weeks most repeat questions disappear.\n\nComment SYSTEM and I'll send you The 7 Boring Systems with the Decision Rules template.\n\nNew here? I'm Tara, founder of Aluna. Follow for fewer questions and better answers.","keyword":"SYSTEM","slug":"29-your-team-has-asked-this-question","placeholders":[]},{"n":"30","line":"The 30-minute Friday review I'd give every founder.","section":"Systems","broll":"a notebook open on a Friday afternoon, a timer set for 30 minutes.","audio":{"track":"Sweet Heat Lightning","artist":"Gregory Alan Isakov"},"backup":"Autumn Colors","caption":"Ten minutes on numbers: cash in the bank, cash due in 30 days, delivery hours, conversations booked.\n\nTen minutes on what reached you this week that shouldn't have. Pick one and give it a new home: a rule, a recording, a role card or a person.\n\nTen minutes on next week. Deep work first, then client time, then admin. Protect at least one half day with nothing in it.\n\nAs an athlete I learned that improvement happens in the review. Business works the same way.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. The Designed Week and Monthly Numbers are built in.\n\nNew here? I'm Tara. Follow for routines that keep the business calm.","keyword":"SYSTEM","slug":"30-the-30-minute-friday-review-id","placeholders":[]},{"n":"31","line":"No decision under $500 should reach you.","section":"Freedom","broll":"an approval request on a phone, a thumb hovering over approve.","audio":{"track":"Housewife","artist":"Tate McRae"},"backup":"What You Waiting For?","caption":"Past $40K a month and still approving small spends, refunds and extras? Then nothing moves without your signature.\n\nSet a spending line. Under an agreed amount, the team decides and logs it in one shared sheet. You can see it; they don't wait.\n\nAdd the same kind of line elsewhere: scope changes under a set number of hours, refunds in the first week, rebooking a supplier you've used before. One sentence per rule. Then hold your nerve the first few times someone decides slightly differently than you would.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 2 comes with a starter list.\n\nNew here? I'm Tara, founder of Aluna. Follow for a business that decides without you.","keyword":"SYSTEM","slug":"31-no-decision-under-500-should-reach","placeholders":[]},{"n":"32","line":"“Can I just check this with you?”","section":"Freedom","broll":"a chat message arriving, the typing dots appearing again and again.","audio":{"track":"Upside Down","artist":"Diana Ross"},"backup":"The Blue Danube Waltz","caption":"Heard ten times a day, it means your team is doing exactly what the business taught them. With no clear line on what they can decide, checking with you is the safe move.\n\nA reply that changes the pattern: “What would you do if I weren't here?” If the answer is reasonable, say “Do that” and nothing else.\n\nDo it for two weeks, then make it a rule: bring me the situation, the options and your recommendation.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about where decisions sit in your business.\n\nNew here? I'm Tara. Follow for a team that brings answers.","keyword":"REDESIGN","slug":"32-can-i-just-check-this-with","placeholders":[]},{"n":"33","line":"Your clients only want you. You designed it that way.","section":"Freedom","broll":"a video call on screen with the same face in every tile.","audio":{"track":"Patient Zero","artist":"Taylor Swift"},"backup":"Luminary","caption":"It starts in the sale: you pitch, so they trust you. Then you run the kick-off. Then every update comes from you, and the relationship never transfers.\n\nDesign the handover before they sign. Introduce the person who'll lead their account in the sales conversation. Have them run the kick-off with you there for the first ten minutes. Every update comes from them, with you copied for the first month.\n\nYour role becomes the quarterly review and the moments that matter. Most clients feel better looked after, because someone is always available.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about your client handover.\n\nNew here? I'm Tara, founder of Aluna. Follow for client relationships that don't depend on you.","keyword":"REDESIGN","slug":"33-your-clients-only-want-you-you","placeholders":[]},{"n":"34","line":"Your marketing stops the week you do.","section":"Freedom","broll":"a content calendar with empty squares, the cursor scrolling past blank weeks.","audio":{"track":"Strangers","artist":"Kenya Grace"},"backup":"Everlong","caption":"If your marketing needs your face, your voice and your evenings, it stops the first busy week. The pipeline dries up two months later.\n\nThe rhythm I trust: one hour a week of your thinking, as a voice memo answering what clients actually ask. Someone else turns that hour into posts, a newsletter and clips. One shared calendar shows what's going out and who owns it. Your job shrinks to the hour and a quick approval.\n\nAfter running brand and marketing for 80+ brands, this is the pattern I'd keep: one source, many formats, a clear owner for each step.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. The Pipeline Rhythm covers this.\n\nNew here? I'm Tara. Follow for marketing that keeps going on your busiest weeks.","keyword":"SYSTEM","slug":"34-your-marketing-stops-the-week-you","placeholders":[]},{"n":"35","line":"4 decisions your team should own by Friday.","section":"Freedom","broll":"a whiteboard with four boxes, names being written into each.","audio":{"track":"Sunshine (Instrumental)","artist":"Twista"},"backup":"Self Aware","caption":"Client scheduling: give someone your calendar rules and let them run it. Small refunds and goodwill gestures: set an amount, and under it they decide and log it. Routine post approval: agree a short checklist, and a post that meets it goes out. Supplier and tool choices under a set budget.\n\nFor each, write the rule in one sentence and the one situation where it still comes to you.\n\nNone of these is risky. All of them take your attention.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It finds the next four.\n\nNew here? I'm Tara, founder of Aluna. Follow for one handover at a time.","keyword":"AUDIT","slug":"35-4-decisions-your-team-should-own","placeholders":[]},{"n":"36","line":"What breaks if you answer nothing for one day?","section":"Freedom","broll":"a phone switching to do not disturb, the screen going dark.","audio":{"track":"My Own Universe","artist":"PattiJ North"},"backup":"Linger","caption":"Tomorrow, 9am to 6pm, you answer nothing. Write down what stops, and be specific. “Sarah can't send the proposal because I haven't approved the price.” “The ads can't go live because only I have the login.”\n\nEach item points to one of four fixes: a decision rule, shared access, a template or an owner.\n\nFix one this week and another next week.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit, which scores this across seven areas of your business.\n\nNew here? I'm Tara. I help founders build businesses that keep moving when they go quiet.","keyword":"AUDIT","slug":"36-what-breaks-if-you-answer-nothing","placeholders":[]},{"n":"37","line":"Team of four. Every approval still comes to you.","section":"Freedom","broll":"a stack of approval notifications on a phone, all addressed to one person.","audio":{"track":"Raindance","artist":"Dave and Tems"},"backup":"Dracula","caption":"You hired to get time back and became the approval desk. It happens when nobody has defined what each person owns.\n\nWrite a Role Card for each person: what they own outright, what they decide without asking, what they bring to you and in what form, and what good looks like, with one example. Walk each person through theirs and ask what's missing. They'll usually tell you with relief.\n\nA team of four should be four people making decisions.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. System 6 includes the Role Card template.\n\nNew here? I'm Tara, founder of Aluna. Follow for a team that owns its work.","keyword":"SYSTEM","slug":"37-team-of-four-every-approval-still","placeholders":[]},{"n":"38","line":"A new client emails. Why does it land with you?","section":"Freedom","broll":"an inbox notification with a new client's name.","audio":{"track":"Self Aware","artist":"Temper City"},"backup":"Hold On, We're Going Home","caption":"The first email sets the pattern for the whole relationship. If it goes to you, every one after it will too.\n\nChange the default. Set up one shared client address the whole team can see. Put it on your contract, invoices and welcome email. Introduce the account lead in the very first message, and send a short onboarding sequence from that address every time.\n\nYou can still be on the thread. You just stop being the thread.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about your client journey.\n\nNew here? I'm Tara. Follow for client journeys that run without you in every message.","keyword":"REDESIGN","slug":"38-a-new-client-emails-why-does","placeholders":[]},{"n":"39","line":"I thought being needed meant I was doing it right.","section":"Freedom","broll":"a coffee going cold beside an open laptop and a full notebook.","audio":{"track":"Linger","artist":"The Cranberries"},"backup":"Sweet Heat Lightning","caption":"Being the person everyone came to felt like proof. That I was good, that the business needed me, that I mattered.\n\nIt took me years to see the cost. A business that needs you for everything can't grow past what you can carry.\n\nAn honest question: if your team could handle most of what reaches you this week, would you feel relieved or a little lost? If lost, that's worth noticing. The business and your identity have grown into each other, and part of redesigning the business is letting them separate.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation.\n\nNew here? I'm Tara, founder of Aluna. Follow for a business that doesn't need you to prove yourself.","keyword":"REDESIGN","slug":"39-i-thought-being-needed-meant-i","placeholders":[]},{"n":"40","line":"One rule turns team questions into decisions.","section":"Freedom","broll":"a notebook page with three short lines: situation, options, recommendation.","audio":{"track":"Hold On, We're Going Home","artist":"Drake"},"backup":"Sunshine (Instrumental)","caption":"Nothing reaches me without three things: what happened, the options, your recommendation.\n\nIt moves the thinking to the person closest to the problem. Half the time, writing the options makes the answer obvious and the question never arrives. The other half, you get a decision that's 80% made.\n\nIntroduce it gently. For two weeks, when a question arrives without the three parts, reply: “What are the options, and what would you recommend?” Then wait.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, where this rule sits inside the Decision Rules.\n\nNew here? I'm Tara. This is the first rule I'd bring into any team.","keyword":"SYSTEM","slug":"40-one-rule-turns-team-questions-into","placeholders":[]},{"n":"41","line":"building a business that doesn't need you. most won't get it.","section":"Identity one-liners","broll":"walking along the shoreline at golden hour, back to camera.","audio":{"track":"Angel Of My Dreams","artist":"JADE"},"backup":"So Easy (To Fall In Love)","caption":"Some people will ask why you're not hiring faster, why you turned down a client who didn't fit, why you're not working weekends when things are going well.\n\nIn practice it looks like one offer defined clearly, a team that owns decisions, numbers checked every Friday and a week designed around deep work and real rest. None of it is flashy. All of it compounds.\n\nI spent years building the other way, through my own agency and 80+ brands. I know which version I'd choose again.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about building yours this way.\n\nNew here? I'm Tara. Follow if you're building differently too.","keyword":"REDESIGN","slug":"41-building-a-business-that-doesnt-need","placeholders":[]},{"n":"42","line":"small team. big margins. fridays off.","section":"Identity one-liners","broll":"a laptop closing slowly on a Friday afternoon, light on the desk.","audio":{"track":"So Easy (To Fall In Love)","artist":"Olivia Dean"},"backup":"Blue Moon","caption":"Small team, because every person you add needs managing, and that lands on the founder unless the structure comes first. Big margins, so a slow month doesn't mean you work through it. Fridays off, because a business that runs one day a week without you is on its way to running a month without you.\n\nTry this: list what you'd remove from your business to have Fridays off within 90 days.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. The Designed Week is where Fridays off begins.\n\nNew here? I'm Tara, founder of Aluna. Follow for the small, profitable version of scale.","keyword":"SYSTEM","slug":"42-small-team-big-margins-fridays-off","placeholders":[]},{"n":"43","line":"a business that needs you daily is a job you can't quit.","section":"Identity one-liners","broll":"an empty desk chair pushed back from a laptop, the screen still glowing.","audio":{"track":"Dracula","artist":"Tame Impala"},"backup":"Housewife","caption":"Most founders start for freedom. Somewhere around $30K a month, many end up in the most demanding job they've had, with no manager, no cover and no leave.\n\nA useful question: how much of what you did this week could only be done by you?\n\nUsually far less than it feels. The rest is work nobody else was shown how to do, given permission for or given access to. Each piece needs a rule, a document or an owner.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It shows how much of your business only works with you in it.\n\nNew here? I'm Tara. Follow for turning the job back into a business.","keyword":"AUDIT","slug":"43-a-business-that-needs-you-daily","placeholders":[]},{"n":"44","line":"busy isn't a business model.","section":"Identity one-liners","broll":"a calendar on screen, every slot filled, scrolling slowly.","audio":{"track":"Housewife","artist":"Tate McRae"},"backup":"Nicole Kidman","caption":"A full calendar feels like proof the business is working. Often it shows the business can't run without you.\n\nSort next week's calendar into three colours. Green: only I can do this, and it's high value. Amber: someone could do it with a rule or a recording. Red: this shouldn't exist.\n\nCancel one red. Hand over one amber. Protect every green. Repeat next week.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. The Designed Week covers this sort in full.\n\nNew here? I'm Tara, founder of Aluna. Follow for a calendar that works for you.","keyword":"SYSTEM","slug":"44-busy-isnt-a-business-model","placeholders":[]},{"n":"45","line":"you don't need a bigger team. you need fewer decisions.","section":"Identity one-liners","broll":"a notebook, a pen drawing a line through half a list.","audio":{"track":"Nicole Kidman","artist":"ADÉLA"},"backup":"Housewife","caption":"When founders feel stretched, the instinct is to hire. Often that adds a manager to your week, and the manager is you.\n\nCount first. For one week, tally every decision you make for the business: pricing a custom request, approving a design, choosing a supplier, deciding which client goes first.\n\nThen sort them. Which could a written rule decide? Which disappear with one standard offer? Which belong to a role that already exists? The hire you need after that is usually different from the one you planned.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It maps where your decisions sit today.\n\nNew here? I'm Tara. Follow for fewer decisions and more room.","keyword":"AUDIT","slug":"45-you-dont-need-a-bigger-team","placeholders":[]},{"n":"46","line":"the goal isn't more revenue. it's more of it reaching you.","section":"Identity one-liners","broll":"a sunset over the water, a glass on a table, the light going gold.","audio":{"track":"Angel Of My Dreams","artist":"JADE"},"backup":"So Easy (To Fall In Love)","caption":"Three numbers tell you more than revenue: what you pay yourself, what's left as profit, and how many hours it took.\n\nA simple target for 2027. Pick a founder salary you'd be proud of. Pick a margin to keep, often 20 to 30% for a service business. Pick the hours a week you want to work. Then design backwards. Which offer delivers that margin? Which clients fit it? Which work comes off your plate?\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about designing your 2027 numbers.\n\nNew here? I'm Tara, founder of Aluna. Follow for growth that reaches the founder.","keyword":"REDESIGN","slug":"46-the-goal-isnt-more-revenue-its","placeholders":[]},{"n":"47","line":"Delegating more won't fix a business built around you.","section":"Identity one-liners","broll":"a hand sliding a folder across a desk, and the folder sliding back.","audio":{"track":"Everlong","artist":"Foo Fighters"},"backup":"Luminary","caption":"You delegated. It came back. You delegated again, more carefully. It came back again.\n\nDelegation breaks in three predictable places. No written standard, so the work comes back for checking. No decision rule, so the person asks before acting. No ownership, so they're doing tasks while you still hold the outcome.\n\nFix those first. Write what good looks like with one example. Write what they can decide without you. Hand over the whole outcome. Then let them get it slightly wrong a couple of times.\n\nComment SYSTEM and I'll send you The 7 Boring Systems. The Role Cards and Decision Rules are built for this.\n\nNew here? I'm Tara. Follow for handovers that stay handed over.","keyword":"SYSTEM","slug":"47-delegating-more-wont-fix-a-business","placeholders":[]},{"n":"48","line":"Booked out isn't success if you're the only one booked.","section":"Identity one-liners","broll":"a booking page on a laptop showing “fully booked”.","audio":{"track":"Blue Moon","artist":"Zara Larsson"},"backup":"Raindance","caption":"“Fully booked until March” sounds like the dream. If every booking needs you personally, it's a waiting list for your exhaustion.\n\nBeing fully booked is the best moment to redesign, because demand finally gives you options. Raise the price on a defined offer. Bring someone in to deliver part of it. Say no to work that doesn't fit.\n\nAsk which parts of what you're booked for genuinely need you. Usually the strategy, the key conversation and the final review. The rest is process.\n\nComment REDESIGN and I'll send you the link to a free 45-minute Redesign Conversation about turning demand into structure.\n\nNew here? I'm Tara, founder of Aluna. Follow for scaling past your own diary.","keyword":"REDESIGN","slug":"48-booked-out-isnt-success-if-youre","placeholders":[]},{"n":"49","line":"You built the business. Now build the one that runs without you.","section":"Identity one-liners","broll":"a woman walking out of a room, the door closing gently behind her.","audio":{"track":"Beautiful Things","artist":"Benson Boone"},"backup":"Ordinary, Alex Warren","caption":"The first version runs on the founder's energy. It has to, because you're sales, delivery and operations.\n\nThe second runs on structure. The shift usually starts between $30K and $80K a month, when the business is busy enough to feel successful and heavy enough to feel unsustainable.\n\nThe order I'd rebuild in: the offer, then who owns which decisions, then delivery, then the weekly numbers, then each role, and last, your week.\n\nComment SYSTEM and I'll send you The 7 Boring Systems, the free guide to building version two.\n\nNew here? I'm Tara. Follow for the second version of your business.","keyword":"SYSTEM","slug":"49-you-built-the-business-now-build","placeholders":[]},{"n":"50","line":"freedom was never the reward for working harder.","section":"Identity one-liners","broll":"paddling out through calm water at first light, the board cutting a line.","audio":{"track":"Ordinary","artist":"Alex Warren"},"backup":"Angel Of My Dreams","caption":"I grew up as an athlete. Work harder, train longer, push through. It works in sport for a while, and in business for a while too.\n\nThen it stops working, and most founders respond by working harder still.\n\nMy own agency and years of work on other people's brands taught me that freedom is the result of building differently. A business that grows without depending on you has to be designed that way.\n\nOne place to start: find the single thing that pulled you back in most often last month. A decision, a client, a task, a login. Design that one thing out.\n\nComment AUDIT and I'll send you the free Founder Dependency Audit. It shows you where to start.\n\nNew here? I'm Tara, founder of Aluna. Follow for freedom by design.","keyword":"AUDIT","slug":"50-freedom-was-never-the-reward-for","placeholders":[]}]</script>
<script>
const REELS = JSON.parse(document.getElementById('reels-data').textContent);
const STATUSES = [
  {id:'film', label:'To film', cls:'st-film'},
  {id:'clip', label:'Clip in', cls:'st-clip'},
  {id:'edited', label:'Edited', cls:'st-edited'},
  {id:'posted', label:'Posted', cls:'st-posted'},
];
const SMAP = Object.fromEntries(STATUSES.map(s=>[s.id,s]));
const state = { rec:{}, view:'board', q:'', section:'', status:'', sort:'n', open:null, db:null, assets:null, downloads:null, user:null };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rec = n => state.rec[n] || {};
const statusOf = n => { const r=rec(n); if (r.status) return r.status; return r.videoId ? 'edited' : 'film'; };
const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
const fmt = v => v==null ? '—' : Number(v).toLocaleString('en-GB');
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—';
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function store(k,v){ try{localStorage.setItem('trd.'+k,v)}catch(e){} }
function load(k){ try{return localStorage.getItem('trd.'+k)}catch(e){return null} }

// ---------- filters & view ----------
[...new Set(REELS.map(r=>r.section))].forEach(s=>$('#f-section').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));
STATUSES.forEach(s=>$('#f-status').insertAdjacentHTML('beforeend',`<option value="${s.id}">${s.label}</option>`));
const VIEWS=['board','list','phone'];
function setView(v, push){ if(!VIEWS.includes(v)) v='board'; state.view=v; store('view',v);
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
  if (push && location.hash !== '#'+v) location.hash = v; render(); }
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view,true)));
addEventListener('hashchange',()=>setView(location.hash.slice(1)));
$('#q').addEventListener('input',e=>{state.q=e.target.value.toLowerCase(); render();});
$('#f-section').addEventListener('change',e=>{state.section=e.target.value; store('section',state.section); render();});
$('#f-status').addEventListener('change',e=>{state.status=e.target.value; store('status',state.status); render();});
$('#f-sort').addEventListener('change',e=>{state.sort=e.target.value; store('sort',state.sort); render();});
state.section=load('section')||''; state.status=load('status')||''; state.sort=load('sort')||'n';
$('#f-section').value=state.section; $('#f-status').value=state.status; $('#f-sort').value=state.sort;

function visible(){
  let list = REELS.filter(r=>(!state.section||r.section===state.section)&&(!state.status||statusOf(r.n)===state.status)
    &&(!state.q||(r.line+' '+r.caption+' '+r.broll).toLowerCase().includes(state.q)));
  const key = {views:r=>-(num(rec(r.n).views)??-1), follows:r=>-(num(rec(r.n).follows)??-1), posted:r=>-(rec(r.n).postedAt?Date.parse(rec(r.n).postedAt):0), n:r=>+r.n}[state.sort];
  return list.sort((a,b)=>key(a)-key(b) || a.n-b.n);
}

function tally(){
  const c = Object.fromEntries(STATUSES.map(s=>[s.id,0])); let views=0, follows=0;
  REELS.forEach(r=>{c[statusOf(r.n)]++; views+=num(rec(r.n).views)||0; follows+=num(rec(r.n).follows)||0;});
  $('#tally').innerHTML = STATUSES.map(s=>`<span><b>${c[s.id]}</b> ${s.label.toLowerCase()}</span>`).join('')
    + `<span><b>${fmt(views)}</b> views</span><span><b>${fmt(follows)}</b> follows</span>`;
}

function cardMeta(r){ const x=rec(r.n);
  return `<div class="meta"><span>${r.n} · ${esc(r.section)}</span>${r.keyword?`<span class="kw">${r.keyword}</span>`:''}
    <span>♪ ${esc(r.audio.track)}</span>${statusOf(r.n)==='posted'?`<span>${fmt(num(x.views))} views · ${fmt(num(x.follows))} follows</span>`:''}</div>`; }

function frame(r, small){ const x=rec(r.n);
  const vid = x.videoId ? `<video src="/_blob/${esc(x.videoId)}" muted playsinline loop preload="metadata"></video>` : '';
  return `<div class="frame">${vid}${x.videoId?'':`<div class="ov"></div><div class="tx">${esc(r.line)}</div>`}
    <span class="badge">${x.videoId?'Edited video':'Overlay preview'}</span></div>`; }

function render(){
  tally();
  const list = visible(), m = $('#main');
  if (!list.length){ m.innerHTML = `<p class="empty">No reels match these filters.</p>`; return; }
  if (state.view==='board'){
    m.innerHTML = `<div class="board">${STATUSES.map(s=>{ const items=list.filter(r=>statusOf(r.n)===s.id);
      return `<div class="col"><h2><span class="pill ${s.cls}">${s.label}</span><span>${items.length}</span></h2>
        ${items.map(r=>`<button class="card" data-n="${r.n}"><span class="ln">${esc(r.line)}</span>${cardMeta(r)}</button>`).join('') || '<div class="empty">Nothing here yet.</div>'}</div>`;}).join('')}</div>`;
  } else if (state.view==='list'){
    m.innerHTML = `<div class="tablewrap"><table><thead><tr><th>#</th><th>On-screen line</th><th>Status</th><th>Audio</th><th>Keyword</th><th>Posted</th><th class="num">Views</th><th class="num">Follows</th><th class="num">Shares</th></tr></thead><tbody>
      ${list.map(r=>{const x=rec(r.n), s=SMAP[statusOf(r.n)]; return `<tr data-n="${r.n}" tabindex="0"><td>${r.n}</td><td class="ln">${esc(r.line)}</td><td><span class="pill ${s.cls}">${s.label}</span></td><td>${esc(r.audio.track)}<div class="note">backup: ${esc(r.backup)}</div></td><td>${r.keyword}</td><td>${fmtDate(x.postedAt)}</td><td class="num">${fmt(num(x.views))}</td><td class="num">${fmt(num(x.follows))}</td><td class="num">${fmt(num(x.shares))}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  } else {
    m.innerHTML = `<div class="phones">${list.map(r=>{const s=SMAP[statusOf(r.n)]; return `<button class="phone" data-n="${r.n}">${frame(r)}<span class="pill ${s.cls}">${r.n} · ${s.label}</span></button>`;}).join('')}</div>`;
    m.querySelectorAll('video').forEach(v=>{ v.parentElement.parentElement.addEventListener('mouseenter',()=>v.play().catch(()=>{})); v.parentElement.parentElement.addEventListener('mouseleave',()=>v.pause()); });
  }
  m.querySelectorAll('[data-n]').forEach(el=>{ el.addEventListener('click',()=>openSheet(el.dataset.n));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') openSheet(el.dataset.n); }); });
  if (state.open) drawSheet();
}

// ---------- persistence ----------
let writing = {};
async function save(n, patch){
  state.rec[n] = {...rec(n), ...patch, updatedAt:new Date().toISOString()};
  render();
  if (!state.db){ toast('Not saved: the shared store is not connected in this view.'); return; }
  const doc = state.db.doc('reels/'+n);
  while (writing[n]) await writing[n];
  writing[n] = doc.set(state.rec[n]).catch(e=>toast('Could not save: '+(e.message||e.code))).finally(()=>{writing[n]=null;});
  await writing[n];
}

// ---------- reel sheet ----------
function openSheet(n){ state.open=n; drawSheet(); }
function closeSheet(){ state.open=null; $('#layer').innerHTML=''; }
function drawSheet(){
  const r = REELS.find(x=>x.n===state.open), x = rec(r.n), st = statusOf(r.n);
  const ph = r.placeholders.length ? `<p class="warn">Confirm before posting: ${r.placeholders.map(esc).join(', ')}</p>` : '';
  $('#layer').innerHTML = `<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="Reel ${r.n}">
    <div class="top"><div><div class="lbl">Reel ${r.n} · ${esc(r.section)}</div><h3>${esc(r.line)}</h3></div><button class="btn" id="x" aria-label="Close">Close</button></div>
    ${ph}
    <div class="grid2"><div>${frame(r)}</div>
      <section>
        <div class="lbl">Status</div>
        <select id="st">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===st?'selected':''}>${s.label}</option>`).join('')}</select>
        <div class="lbl">Clip</div><div>${esc(r.broll)}</div>
        <div class="lbl">Audio, added in Edits or Instagram</div><div>${esc(r.audio.track)}${r.audio.artist?', '+esc(r.audio.artist):''}<div class="note">Backup: ${esc(r.backup)}. Use the backup if the reel count has stopped rising.</div></div>
      </section></div>
    <section>
      <div class="lbl">Edited video</div>
      ${x.videoId?`<div class="row"><span>${esc(x.videoName||r.slug+'.mp4')}</span><button class="btn" id="rep">Replace</button></div>`:`<div class="row"><button class="btn" id="up">Add edited video</button><span class="note">The 7-second export from Edits or from the render script, under 20 MB.</span></div>`}
      <input type="file" id="file" accept="video/mp4,video/quicktime" hidden>
      ${state.assets?'':`<div class="offline">Adding videos needs edit access to this desk.</div>`}
    </section>
    <section>
      <div class="row" style="justify-content:space-between"><div class="lbl">Caption</div><button class="btn" id="copy">Copy caption</button></div>
      <div class="cap" id="captext">${esc(r.caption)}</div>
    </section>
    <section>
      <button class="btn primary" id="post" ${x.videoId?'':'disabled'}>${st==='posted'?'Post again':'Post'}</button>
      ${x.videoId?'':'<span class="note">Add the edited video first. Post exports it with the caption and the trial reel settings.</span>'}
      ${x.postedAt?`<span class="note">Posted ${new Date(x.postedAt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} as a trial reel, Facebook and Threads off${x.audioUsed?', audio: '+esc(x.audioUsed):''}.</span>`:''}
    </section>
    <section>
      <div class="lbl">Results</div>
      <div class="stats">
        <label>Views<input type="number" min="0" id="views" value="${esc(x.views??'')}"></label>
        <label>Follows<input type="number" min="0" id="follows" value="${esc(x.follows??'')}"></label>
        <label>Shares<input type="number" min="0" id="shares" value="${esc(x.shares??'')}"></label>
      </div>
      <label class="lbl" for="notes">Notes</label>
      <textarea id="notes" placeholder="What changed, what to test next">${esc(x.notes??'')}</textarea>
    </section>
  </aside>`;
  $('#scrim').onclick = $('#x').onclick = closeSheet;
  $('#st').onchange = e => save(r.n,{status:e.target.value});
  $('#copy').onclick = () => copyCaption(r);
  const pick = () => $('#file').click();
  if ($('#up')) $('#up').onclick = pick; if ($('#rep')) $('#rep').onclick = pick;
  if (!state.assets){ if($('#up')) $('#up').disabled=true; if($('#rep')) $('#rep').disabled=true; }
  $('#file').onchange = e => upload(r, e.target.files[0]);
  $('#post').onclick = () => openPost(r);
  ['views','follows','shares','notes'].forEach(k=>$('#'+k).addEventListener('change',e=>save(r.n,{[k]:e.target.value})));
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('.post')) $('.post').remove(); else if(state.open) closeSheet(); }});

async function copyCaption(r){
  try { await navigator.clipboard.writeText(r.caption); toast('Caption copied'); return true; }
  catch(e){ const el=$('#captext')||$('#pcap'); if(el){ const s=getSelection(), rg=document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg);} toast('Caption selected: press copy on your keyboard'); return false; }
}

async function upload(r, f){
  if (!f || !state.assets) return;
  if (f.size > 20*1024*1024){ toast('That file is over 20 MB. Export at 1080p and try again.'); return; }
  toast('Uploading…');
  try { const a = await state.assets.upload(f);
    const x = rec(r.n), patch = {videoId:a.id, videoName:f.name};
    if (statusOf(r.n)!=='posted') patch.status='edited';
    await save(r.n, patch); toast('Edited video added');
  } catch(e){ toast('Upload failed: '+(e.message||e.code)); }
}

// ---------- post flow ----------
function openPost(r){
  const x = rec(r.n), d = {exported:false, copied:false};
  const el = document.createElement('div'); el.className='post';
  el.innerHTML = `<div class="scrim"></div><div class="box" role="dialog" aria-modal="true" aria-label="Post reel ${r.n}" style="position:relative;z-index:1">
    <div><div class="lbl">Post reel ${r.n} to @taraphilipofficial</div><h4>${esc(r.line)}</h4></div>
    <div class="step" id="s1"><span class="no">1</span><div><b>Export the reel</b><div class="note">Saves ${esc(r.slug)}.mp4 to this device.</div><div class="row" style="margin-top:6px"><button class="btn primary" id="exp">Export video</button></div></div></div>
    <div class="step" id="s2"><span class="no">2</span><div><b>Copy the caption</b><div class="cap" id="pcap" style="max-height:120px;margin-top:6px">${esc(r.caption)}</div><div class="row" style="margin-top:6px"><button class="btn" id="cp">Copy caption</button></div></div></div>
    <div class="step" id="s3"><span class="no">3</span><div><b>In Edits or Instagram, before you share</b>
      <div class="checks">
        <label><input type="checkbox" id="c-audio"> Audio added: ${esc(r.audio.track)} <span class="note">(or ${esc(r.backup)})</span></label>
        <label><input type="checkbox" id="c-trial"> Trial reel is <b>on</b></label>
        <label><input type="checkbox" id="c-fb"> Share to Facebook is <b>off</b></label>
        <label><input type="checkbox" id="c-th"> Share to Threads is <b>off</b></label>
      </div></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="done" disabled>Mark as posted</button></div>
  </div>`;
  document.body.appendChild(el);
  const check = () => { const ok = d.exported && d.copied && ['c-audio','c-trial','c-fb','c-th'].every(id=>$('#'+id,el).checked);
    $('#done',el).disabled = !ok; $('#s1',el).classList.toggle('done',d.exported); $('#s2',el).classList.toggle('done',d.copied);
    $('#s3',el).classList.toggle('done',['c-audio','c-trial','c-fb','c-th'].every(id=>$('#'+id,el).checked)); };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('change',check));
  $('#cancel',el).onclick = $('.scrim',el).onclick = () => el.remove();
  $('#cp',el).onclick = async () => { await copyCaption(r); d.copied = true; check(); };
  $('#exp',el).onclick = async () => {
    if (!state.downloads){ toast('Export is not available in this view. Open the desk on claude.ai.'); return; }
    const b=$('#exp',el); b.disabled=true; b.textContent='Preparing…';
    try { const blob = await (await fetch('/_blob/'+x.videoId)).blob();
      await state.downloads.save({filename:r.slug+'.mp4', data:blob}); d.exported=true; b.textContent='Exported'; toast('Video saved');
    } catch(e){ b.disabled=false; b.textContent='Export video'; toast(e && e.code==='declined' ? 'Export cancelled' : 'Export failed: '+((e&&e.message)||e)); }
    check(); };
  $('#done',el).onclick = async () => { el.remove();
    await save(r.n,{status:'posted', postedAt:new Date().toISOString(), audioUsed:r.audio.track,
      postSettings:{account:'@taraphilipofficial', trialReel:true, shareToFacebook:false, shareToThreads:false}});
    toast('Marked as posted'); };
  check();
}

// ---------- boot ----------
setView(location.hash.slice(1) || load('view') || 'board');
(async()=>{
  const c = window.claude; if (!c || !c.use){ $('#sync').textContent='Offline preview: changes are not saved.'; return; }
  const [db, assets, downloads] = await Promise.all([c.use('db'), c.use('assets'), c.use('downloads')]);
  Object.assign(state,{db, assets, downloads});
  if (!db){ $('#sync').textContent='Read only: sign in to save changes.'; render(); return; }
  db.collection('reels').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if (d.exists && !writing[d.id]) state.rec[d.id]=d.data(); });
    $('#sync').textContent='Saved for everyone with access'; render();
  }, e=>{ $('#sync').textContent='Could not load saved progress ('+(e.code||'error')+').'; });
})();
</script>
